name: Smoke test

# Builds each add-on's image and actually starts it (with a fake
# Supervisor options.json) on every push and PR touching either add-on:
# checks it reaches a healthy state and does one add-on-specific
# functional check. Both jobs run unconditionally on any push/PR matching
# either path -- simpler than per-job path filtering, and cheap enough
# not to matter.

on:
  push:
    branches: [main]
    paths:
      - "docsight/**"
      - "speedtest-tracker/**"
      - ".github/workflows/smoke-test.yml"
  pull_request:
    paths:
      - "docsight/**"
      - "speedtest-tracker/**"
      - ".github/workflows/smoke-test.yml"

jobs:
  docsight-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image (amd64, no push)
        run: docker build -t docsight-smoke:test docsight

      - name: Write fake Supervisor options.json
        run: |
          mkdir -p /tmp/docsight-data
          cat > /tmp/docsight-data/options.json <<'JSON'
          {
            "modem_type": "fritzbox",
            "modem_url": "http://192.168.178.1",
            "modem_user": "",
            "modem_password": "",
            "poll_interval": 900,
            "log_level": "INFO",
            "mqtt_host": "",
            "mqtt_port": 1883,
            "mqtt_user": "",
            "mqtt_password": "",
            "admin_password": "",
            "demo_mode": true
          }
          JSON

      - name: Start container
        run: |
          docker run -d --name docsight-smoke \
            -p 8765:8765 \
            -v /tmp/docsight-data:/data \
            docsight-smoke:test

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8765/health; then
              echo
              echo "Healthy after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Container never became healthy within 60s"
          exit 1

      - name: Trigger a scheduled backup and check it persists via /data
        run: |
          curl -fsS -X POST http://localhost:8765/api/backup/scheduled
          echo
          found=""
          for i in $(seq 1 10); do
            found="$(find /tmp/docsight-data/backups -maxdepth 1 -name 'docsight_backup_*.tar.gz' 2>/dev/null)"
            [ -n "$found" ] && break
            sleep 1
          done
          if [ -z "$found" ]; then
            echo "::error::No backup file appeared under /tmp/docsight-data/backups"
            exit 1
          fi
          echo "Found backup on the host-mounted /data volume: $found"

      - name: Dump container logs
        if: always()
        run: docker logs docsight-smoke || true

      - name: Clean up
        if: always()
        run: docker rm -f docsight-smoke || true

  speedtest-tracker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image (amd64, no push)
        run: docker build -t speedtest-tracker-smoke:test speedtest-tracker

      - name: Write fake Supervisor options.json
        run: |
          mkdir -p /tmp/speedtest-tracker-data
          cat > /tmp/speedtest-tracker-data/options.json <<'JSON'
          {
            "app_url": "http://homeassistant.local:8087",
            "timezone": "Europe/Berlin",
            "admin_name": "Admin",
            "admin_email": "admin@example.com",
            "admin_password": "smoke-test-password",
            "speedtest_schedule": "0 */6 * * *",
            "speedtest_servers": ""
          }
          JSON

      - name: Start container
        run: |
          docker run -d --name speedtest-tracker-smoke \
            -p 8087:80 \
            -v /tmp/speedtest-tracker-data:/config \
            speedtest-tracker-smoke:test

      - name: Wait for /api/healthcheck
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8087/api/healthcheck; then
              echo
              echo "Healthy after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Container never became healthy within 60s"
          exit 1

      - name: Verify the admin account was created with the configured credentials
        run: |
          docker exec speedtest-tracker-smoke php -r '
            $db = new PDO("sqlite:/config/database.sqlite");
            $row = $db->query("SELECT email FROM users WHERE email = \"admin@example.com\"")->fetch();
            if (!$row) { fwrite(STDERR, "admin user not found\n"); exit(1); }
            echo "admin user found: " . $row["email"] . PHP_EOL;
          '

      - name: Verify APP_KEY persists across a restart
        run: |
          key_before="$(cat /tmp/speedtest-tracker-data/.app_key)"
          docker restart speedtest-tracker-smoke
          for i in $(seq 1 30); do
            curl -fs http://localhost:8087/api/healthcheck && break
            sleep 2
            if [ "$i" = 30 ]; then echo "::error::never became healthy after restart"; docker logs speedtest-tracker-smoke; exit 1; fi
          done
          key_after="$(cat /tmp/speedtest-tracker-data/.app_key)"
          if [ "$key_before" != "$key_after" ]; then
            echo "::error::APP_KEY changed across a restart -- would break existing encrypted data"
            exit 1
          fi
          echo "APP_KEY persisted across restart"

      - name: Dump container logs
        if: always()
        run: docker logs speedtest-tracker-smoke || true

      - name: Clean up
        if: always()
        run: docker rm -f speedtest-tracker-smoke || true
