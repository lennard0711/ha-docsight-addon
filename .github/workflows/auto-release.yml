name: Auto-release on upstream bump

# On a merged Renovate PR (pinned upstream tag changed on main), bumps
# that add-on's config.yaml version to <new-tag>-addon.1, adds a
# CHANGELOG entry, creates the GitHub release, and dispatches the build --
# so merging the PR is the only manual step.
#
# The CHANGELOG entry (which Home Assistant shows in the add-on's update
# dialog) and the GitHub release carry the upstream project's own release
# notes, fetched by .github/scripts/release-notes.sh; if that fails they
# fall back to a one-line "Update to upstream" message. For docsight,
# .github/scripts/sync-drivers.sh also adds modem drivers that upstream
# registers but the modem_type schema lacks to docsight/config.yaml (part
# of the same version-bump commit) and mentions them in the notes; if the
# edit can't be applied cleanly it is reverted and only a warning is added.
#
# Every step is idempotent: if a run fails after the bump was pushed (e.g.
# creating the release), re-running the job creates just the missing
# release and build.
#
# The release tag is "<addon-slug>/<version>" (e.g.
# "docsight/v2026-08-07.1-addon.7") so build.yml knows which add-on and
# image a given release is for -- each add-on in this repo has its own
# GHCR image.
#
# The build is dispatched directly since releases created with the default
# GITHUB_TOKEN don't trigger other workflows' `release` events.
#
# Manual add-on-only releases (addon.N bumps without an upstream change)
# are unaffected on push: the guard below skips whenever config.yaml's
# version already matches the pinned upstream tag.
#
# The workflow can also be started by hand (workflow_dispatch) for one
# add-on: it then always releases the next <upstream>-addon.<N+1>, with the
# upstream notes for the pinned tag. With dry_run (the default) it only
# prints the version, notes and CHANGELOG diff in the job log and changes
# nothing.
#
# Matrix jobs run one at a time (max-parallel: 1) so two add-ons bumped in
# the same push can't race each other's commit+push.

on:
  push:
    branches: [main]
    paths:
      - "docsight/Dockerfile"
      - "docsight/build.yaml"
      - "speedtest-tracker/Dockerfile"
      - "speedtest-tracker/build.yaml"
  workflow_dispatch:
    inputs:
      addon:
        description: "Which add-on to release"
        required: true
        type: choice
        options:
          - docsight
          - speedtest-tracker
      dry_run:
        description: "Only print what would be released (no commit, release or build)"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

jobs:
  auto-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        addon: ${{ fromJson(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.addon) || '["docsight","speedtest-tracker"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare pinned upstream tag with add-on version
        id: detect
        env:
          ADDON: ${{ matrix.addon }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          upstream=$(grep -oP '^ARG BUILD_FROM=.+:\K\S+$' "${ADDON}/Dockerfile")
          current=$(grep -oP '^version:\s*"\K[^"]+' "${ADDON}/config.yaml")
          echo "[$ADDON] Pinned upstream: ${upstream} / current add-on version: ${current}"
          if [ -z "$upstream" ] || [ -z "$current" ]; then
            echo "::error::Could not extract upstream tag or add-on version for ${ADDON}"
            exit 1
          fi
          {
            echo "upstream=${upstream}"
            echo "bump=false"
            echo "release_only=false"
            echo "manual_rerelease=false"
          } >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "workflow_dispatch" ] && [[ "$current" == "${upstream}-addon."* ]]; then
            # Manual run for an already-released upstream tag: next addon.N.
            n="${current##*-addon.}"
            echo "bump=true" >> "$GITHUB_OUTPUT"
            echo "manual_rerelease=true" >> "$GITHUB_OUTPUT"
            echo "new_version=${upstream}-addon.$((n + 1))" >> "$GITHUB_OUTPUT"
          elif [[ "$current" != "${upstream}-addon."* ]]; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
            echo "new_version=${upstream}-addon.1" >> "$GITHUB_OUTPUT"
          elif [ "$current" = "${upstream}-addon.1" ] \
              && ! gh release view "${ADDON}/${current}" >/dev/null 2>&1; then
            # A previous run bumped the version but never created the release.
            echo "Version already bumped, but release ${ADDON}/${current} is missing -- creating it."
            echo "release_only=true" >> "$GITHUB_OUTPUT"
            echo "new_version=${current}" >> "$GITHUB_OUTPUT"
          else
            echo "Add-on version already tracks this upstream tag -- nothing to do."
          fi

      - name: Fetch upstream release notes
        if: steps.detect.outputs.bump == 'true' || steps.detect.outputs.release_only == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM: ${{ steps.detect.outputs.upstream }}
          ADDON: ${{ matrix.addon }}
          MANUAL: ${{ steps.detect.outputs.manual_rerelease }}
          BUMP: ${{ steps.detect.outputs.bump }}
        run: |
          .github/scripts/release-notes.sh "$ADDON" "$UPSTREAM" > "$RUNNER_TEMP/notes.md"
          if [ "$MANUAL" = "true" ]; then
            { printf '%s\n\n' "_Re-release of the add-on with the upstream release notes (no upstream change)._"; cat "$RUNNER_TEMP/notes.md"; } > "$RUNNER_TEMP/notes.tmp"
            mv "$RUNNER_TEMP/notes.tmp" "$RUNNER_TEMP/notes.md"
          fi
          # Only on a real bump: in release-only mode the version commit (and
          # with it the schema sync) already happened in the earlier run.
          if [ "$ADDON" = "docsight" ] && [ "$BUMP" = "true" ]; then
            note="$(.github/scripts/sync-drivers.sh "$UPSTREAM")"
            if [ -n "$note" ]; then
              echo "::notice::${note}"
              { printf '%s\n\n' "$note"; cat "$RUNNER_TEMP/notes.md"; } > "$RUNNER_TEMP/notes.tmp"
              mv "$RUNNER_TEMP/notes.tmp" "$RUNNER_TEMP/notes.md"
            fi
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Bump config.yaml and CHANGELOG
        if: steps.detect.outputs.bump == 'true'
        env:
          NEW_VERSION: ${{ steps.detect.outputs.new_version }}
          ADDON: ${{ matrix.addon }}
        run: |
          sed -i "s|^version: \".*\"|version: \"${NEW_VERSION}\"|" "${ADDON}/config.yaml"
          awk -v ver="$NEW_VERSION" -v nf="$RUNNER_TEMP/notes.md" '
            NR==1 { print; print ""; print "## " ver; print "";
                    while ((getline line < nf) > 0) print line; next }
            { print }
          ' "${ADDON}/CHANGELOG.md" > "$RUNNER_TEMP/changelog.md"
          mv "$RUNNER_TEMP/changelog.md" "${ADDON}/CHANGELOG.md"
          git diff --stat

      - name: Dry run -- show what would be committed
        if: inputs.dry_run
        env:
          NEW_VERSION: ${{ steps.detect.outputs.new_version }}
        run: |
          echo "Dry run: would release ${ADDON:-${{ matrix.addon }}}/${NEW_VERSION} -- nothing is committed, released or built."
          git diff

      - name: Commit and push
        if: steps.detect.outputs.bump == 'true' && !inputs.dry_run
        env:
          NEW_VERSION: ${{ steps.detect.outputs.new_version }}
          ADDON: ${{ matrix.addon }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898024+github-actions[bot]@users.noreply.github.com"
          git add "${ADDON}/config.yaml" "${ADDON}/CHANGELOG.md"
          git commit -m "Auto-bump ${ADDON} version to ${NEW_VERSION}"
          git pull --rebase
          git push

      - name: Create release and dispatch build
        if: (steps.detect.outputs.bump == 'true' || steps.detect.outputs.release_only == 'true') && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.detect.outputs.new_version }}
          ADDON: ${{ matrix.addon }}
        run: |
          gh release create "${ADDON}/${NEW_VERSION}" \
            --title "${ADDON} ${NEW_VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md"
          gh workflow run build.yml -f addon="$ADDON" -f version="$NEW_VERSION"
