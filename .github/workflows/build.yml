name: Build and publish

# Uses the modern reusable sub-actions from home-assistant/builder
# (the old monolithic `home-assistant/builder@master` action is deprecated).
# Pinned to the same commit the sub-actions themselves use internally for
# cross-referencing (tag 2026.06.0) rather than floating on `master`.

on:
  release:
    types: [published]

env:
  IMAGE_NAME: docsight
  BUILDER_REF: 4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          architectures: '["amd64", "aarch64"]'
          image-name: ${{ env.IMAGE_NAME }}

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build and push ${{ matrix.arch }} image
        uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          arch: ${{ matrix.arch }}
          image: ${{ matrix.image }}
          image-tags: ${{ github.event.release.tag_name }}
          version: ${{ github.event.release.tag_name }}
          context: docsight
          push: "true"
          cosign: "false"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

  publish-manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          architectures: '["amd64", "aarch64"]'
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: ${{ github.event.release.tag_name }}
          cosign: "false"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
