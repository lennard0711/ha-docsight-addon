---
# We inherit from the upstream DOCSight image rather than a Home Assistant
# base image, so build_from does not point at ghcr.io/hassio-addons/base
# variants -- it points at the upstream DOCSight tag for each arch.
#
# Verified via `docker manifest inspect` against
# ghcr.io/itsdnns/docsight:v2026-08-07.1: upstream publishes amd64, arm64
# (aarch64) and armv7 platform manifests for every tag, so no from-source
# build is needed for Raspberry Pi 5 / HAOS aarch64.
build_from:
  aarch64: "ghcr.io/itsdnns/docsight:v2026-08-07.1"
  amd64: "ghcr.io/itsdnns/docsight:v2026-08-07.1"
args:
  BUILD_FROM: "ghcr.io/itsdnns/docsight:v2026-08-07.1"
labels:
  org.opencontainers.image.title: "DOCSight"
  org.opencontainers.image.description: "Unofficial Home Assistant add-on wrapper for itsDNNS/docsight"
  org.opencontainers.image.source: "https://github.com/itsDNNS/docsight"
  org.opencontainers.image.licenses: "MIT"
