configuration:
  web_ui:
    name: Web UI access
    description: >-
      "ingress" serves the UI through the Home Assistant sidebar (enable
      "Show in sidebar" on the add-on page). "direct" serves it on port
      8765 instead. The two are mutually exclusive -- with ingress active,
      direct port access shows broken links, and vice versa.
  modem_type:
    name: Modem type
    description: >-
      Which DOCSight modem driver to use. See DOCS for the full list of
      supported modems.
  modem_url:
    name: Modem URL
    description: >-
      Base URL of your modem's admin/diagnostic interface, e.g.
      http://192.168.178.1 or http://192.168.100.1.
  modem_user:
    name: Modem username
    description: Username for the modem admin interface, if required.
  modem_password:
    name: Modem password
    description: Password for the modem admin interface, if required.
  poll_interval:
    name: Poll interval (seconds)
    description: How often DOCSight polls the modem for signal data.
  log_level:
    name: Log level
    description: Container log verbosity.
  mqtt_host:
    name: MQTT broker host
    description: >-
      Hostname of your MQTT broker. With the default (core-mosquitto) and
      no credentials set, connection details are fetched automatically from
      the Mosquitto add-on. Leave blank to disable MQTT.
  mqtt_port:
    name: MQTT broker port
    description: Port of your MQTT broker.
  mqtt_user:
    name: MQTT username
    description: >-
      Username for the MQTT broker. Leave blank (along with the password)
      to auto-configure from the Mosquitto add-on.
  mqtt_password:
    name: MQTT password
    description: >-
      Password for the MQTT broker. Leave blank (along with the username)
      to auto-configure from the Mosquitto add-on.
  admin_password:
    name: DOCSight admin password
    description: Login password for DOCSight's own web UI.
  demo_mode:
    name: Demo mode
    description: >-
      Run DOCSight with 9 months of synthetic demo data instead of polling a
      real modem.
network:
  8765/tcp: DOCSight web UI
