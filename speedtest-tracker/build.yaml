---
# Builds on top of the LinuxServer.io speedtest-tracker image, itself a
# multi-arch manifest (amd64, aarch64), so both architectures point at
# the same tag.
build_from:
  aarch64: "ghcr.io/linuxserver/speedtest-tracker:v1.15.0-ls169"
  amd64: "ghcr.io/linuxserver/speedtest-tracker:v1.15.0-ls169"
args:
  BUILD_FROM: "ghcr.io/linuxserver/speedtest-tracker:v1.15.0-ls169"
labels:
  org.opencontainers.image.title: "Speedtest Tracker"
  org.opencontainers.image.description: "Unofficial Home Assistant add-on wrapper for alexjustesen/speedtest-tracker (LinuxServer.io build)"
  org.opencontainers.image.source: "https://github.com/alexjustesen/speedtest-tracker"
  org.opencontainers.image.licenses: "MIT"
