---
slug: docsight-dev
name: "DOCSight (dev: Ingress fix test)"
description: >-
  TEMPORARY dev build for testing itsDNNS/docsight issue #781 (Ingress /
  reverse-proxy path-prefix support) against a real Home Assistant Ingress
  setup. Built from an unreleased upstream commit -- not for production
  use. Separate slug/image/port from the regular "docsight" add-on, so
  both can be installed side by side.
url: "https://github.com/itsDNNS/docsight/issues/781"
version: "dev-issue781.1"
arch:
  - aarch64
  - amd64
image: "ghcr.io/lennard0711/docsight-dev"
startup: services
boot: manual
ingress: true
ingress_port: 8765
hassio_api: true
options:
  modem_type: "fritzbox"
  modem_url: "http://192.168.178.1"
  modem_user: ""
  modem_password: ""
  poll_interval: 900
  log_level: "INFO"
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  admin_password: ""
  demo_mode: true
schema:
  modem_type: "list(fritzbox|tc4400|ultrahub7|vodafone_station|ch7465|ch7465_play|cm1000|cm3000|cm3500|surfboard|sb6141|sb6183|sb6190|cm8200|hitron|hitron_coda_4680|sagemcom|f3896lg|sercom_dm1000|cgm4981|generic)"
  modem_url: "url"
  modem_user: "str"
  modem_password: "password"
  poll_interval: "int(60,14400)"
  log_level: "list(DEBUG|INFO|WARNING|ERROR)"
  mqtt_host: "str"
  mqtt_port: "port"
  mqtt_user: "str"
  mqtt_password: "password"
  admin_password: "password"
  demo_mode: "bool"
