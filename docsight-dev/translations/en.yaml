configuration:
  modem_type:
    name: Modem type
    description: >-
      Which DOCSight modem driver to use. Doesn't matter if demo_mode is on.
  modem_url:
    name: Modem URL
    description: >-
      Base URL of your modem's admin/diagnostic interface. Doesn't matter if
      demo_mode is on.
  modem_user:
    name: Modem username
    description: Username for the modem admin interface, if required.
  modem_password:
    name: Modem password
    description: Password for the modem admin interface, if required.
  poll_interval:
    name: Poll interval (seconds)
    description: How often DOCSight polls the modem for signal data.
  log_level:
    name: Log level
    description: Container log verbosity.
  mqtt_host:
    name: MQTT broker host
    description: Hostname of your MQTT broker. Leave blank to disable MQTT.
  mqtt_port:
    name: MQTT broker port
    description: Port of your MQTT broker.
  mqtt_user:
    name: MQTT username
    description: Username for the MQTT broker, if required.
  mqtt_password:
    name: MQTT password
    description: Password for the MQTT broker, if required.
  admin_password:
    name: DOCSight admin password
    description: Login password for DOCSight's own web UI.
  demo_mode:
    name: Demo mode
    description: >-
      Run DOCSight with synthetic demo data instead of polling a real modem.
      On by default in this dev build so you don't need a real modem to
      test the Ingress journeys.
